seed: 42

train:
  timesteps: 10000
buffer:
  buffer_size: 1024
eval:
  threshold: 0.0               # V(s) > 0 is the unsafe set by our formulation
agent:
  learning_epochs: 1
  batch_size: 4096
  discount_factor: 0.99
  learning_rate: 1.0e-05
  learning_starts: 1024
  grad_norm_clip: 1.0
  tau: 0.005

# Initial-condition dataset collection
collection:
  capacity_per_bucket: 100000
  thresholds:
    low_high: -0.1
    mid_high: 0.5
  max_timestep: 64000
  warmup_skip_steps: 4
  subsample_stride: 4
  save_subdir: "collected"