seed: 42

train:
  timesteps: 19200

buffer:
  buffer_size: 1024

agent:
  class: RiskFlow
  batch_size: 4096
  learning_starts: 64
  gradient_steps: 1
  grad_norm_clip: 1.0

  exploration_sigma: 0.0

  critic_learning_rate: 3.0e-04
  target_update_tau: 0.005
  actor_learning_rate: 1.0e-04
  control_cost_scale: 1.0e-03

  update_actor: false
  update_dual: false
  dual_learning_rate: 1.0e-03
  terminal_risk_threshold: 0.0
  lagrange_init: 0.0

  experiment:
    write_interval: auto
    checkpoint_interval: auto