seed: 42

train:
  timesteps: 32000
  optimize_freq: 1
  update_per_opt: 1

buffer:
  buffer_size: 1024

agent:
  class: SafetyQ
  batch_size: 4096
  learning_starts: 64
  grad_norm_clip: 1.0

  discount_factor: 0.8
  gamma_schedule:
    enabled: true
    period: 25000
    decay: 0.5
    end_value: 0.999
    goal_value: 1.0

  alpha: 0.1
  learn_alpha: true

  critic_learning_rate: 1.0e-04
  actor_learning_rate: 1.0e-04
  alpha_learning_rate: 1.0e-04
  tau: 0.01
  update_period: 1

  rho_schedule:
    init_value: 1.0
    period: 25000
    decay: 0.5
    end_value: 0.0

  epsilon_schedule:
    init_value: 0.0
    period: 50000
    decay: 0.5
    end_value: 1.0
    goal_value: 1.0

  shield_threshold: 0.0

  model:
    min_log_std: -10.0
    max_log_std: 1.0

  experiment:
    directory: "r1_intervention"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
