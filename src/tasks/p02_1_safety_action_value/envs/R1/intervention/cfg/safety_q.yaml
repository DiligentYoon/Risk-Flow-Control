seed: 42

train:
  timesteps: 36000
  learning_starts: 256

buffer:
  buffer_size: 1024

agent:
  class: SafetyQ
  batch_size: 16384
  grad_norm_clip: 0.0
  num_grad_step: 8

  discount_factor: 0.9
  gamma_schedule:
    enabled: true
    period: 10000
    decay: 0.7
    end_value: 0.999
    goal_value: 0.999

  alpha: 0.005
  learn_alpha: false

  critic_learning_rate: 5.0e-04
  actor_learning_rate: 5.0e-04
  alpha_learning_rate: 2.0e-05
  tau: 0.005
  update_period: 2

  threshold: 0.0

  model:
    min_log_std: -20.0
    max_log_std: 2.0

  experiment:
    directory: "r1_intervention"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
