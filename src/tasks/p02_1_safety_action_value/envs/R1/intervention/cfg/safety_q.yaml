seed: 42

train:
  timesteps: 36000
  optimize_freq: 1
  update_per_opt: 2

buffer:
  buffer_size: 1024

agent:
  class: SafetyQ
  batch_size: 4096
  learning_starts: 64
  grad_norm_clip: 1.0

  discount_factor: 0.99
  gamma_schedule:
    enabled: true
    period: 3000
    decay: 0.5
    end_value: 0.999
    goal_value: 1.0

  alpha: 0.0
  learn_alpha: false

  critic_learning_rate: 5.0e-04
  actor_learning_rate: 1.0e-04
  alpha_learning_rate: 1.0e-04
  tau: 0.05
  update_period: 1

  rho_schedule:
    init_value: 1.0
    period: 6000
    decay: 0.8
    end_value: 0.0

  epsilon_schedule:
    init_value: 0.1
    period: 6000
    decay: 0.8
    end_value: 1.0
    goal_value: 1.0

  shield_threshold: 0.0

  model:
    min_log_std: -20.0
    max_log_std: 1.0

  experiment:
    directory: "r1_intervention"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
