seed: 42

train:
  timesteps: 128000

buffer:
  buffer_size: 512

models:
  critic:
    output_gain: 0.01
  actor:
    output_gain: 0.01

agent:
  class: RiskFlow
  # Recovery deadline H. `auto` reads it from the environment as `max_episode_length - 1`.
  horizon: auto

  batch_size: 4096
  learning_starts: 64
  gradient_steps: 1
  grad_norm_clip: 1.0

  exploration_sigma: 0.1

  critic_learning_rate: 3.0e-04
  target_update_tau: 0.005
  actor_learning_rate: 1.0e-04
  control_cost_scale: 1.0e-04

  # Terminal recovery constraint. Turning the dual off is the `lambda = 0` ablation of plan.md P5.2,
  # not a debug switch: the actor loss then carries the mean flow and the control cost only.
  update_dual: false
  dual_learning_rate: 1.0e-03
  terminal_risk_threshold: 0.0
  lagrange_init: 0.0

  experiment:
    directory: "g1_risk"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

predictor:
  agent:
    learning_epochs: 1
    batch_size: 4096
    discount_factor: 0.9999
    learning_rate: 5.0e-05
    learning_starts: 1024
    grad_norm_clip: 1.0
