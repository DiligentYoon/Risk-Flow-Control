[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-flow-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "onnx",
    "onnxruntime",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]